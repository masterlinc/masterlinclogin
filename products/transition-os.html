<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>转型操作系统 · Transition OS · 每天 15-30 分钟，用碎片时间积累长期资产</title>
  <meta name="description" content="给边工作边转型的你：红黄绿日判断今日状态 → 系统推荐今日唯一动作 → 资产/证据自动沉淀 → 90 天母线不换 → 每周只呈现事实的复盘。" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌱</text></svg>" />
  <style>
    /* ===== Transition OS 独立样式（自包含，不依赖站点全局） ===== */
    :root {
      --bg: #050505;
      --card: #0b0b0b;
      --card2: #101010;
      --line: #2a2a28;
      --line-soft: rgba(244, 243, 239, 0.18);
      --text: #f4f3ef;
      --sub: #a8a8a5;
      --dim: #6f6f6c;
      --red: #e5484d;
      --red-bg: rgba(229,72,77,0.12);
      --yellow: #f2b13c;
      --yellow-bg: rgba(242,177,60,0.12);
      --green: #46a758;
      --green-bg: rgba(70,167,88,0.12);
      --accent: #f4f3ef;
      /* 看板 v1.7.0 新增：语义色与热力亮度阶（中性阶，色盲友好） */
      --asset: #7C9CF5;
      --evidence: #E8A33D;
      --heat-0: #161616;
      --heat-1: #2a2a28;
      --heat-2: #8a8a85;
      --heat-3: #f4f3ef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    input, textarea, select { font-family: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; width: 100%; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--text); }
    input::placeholder, textarea::placeholder { color: #6f6f6c; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a8a8a5' fill='none' stroke-width='1.6'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; }
    .hide { display: none !important; }

    /* 云备份开关（switch） */
    .switch-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; font-size: 14px; color: var(--sub); }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: var(--line); border-radius: 24px; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--green); }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .cloud-backup-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card2); margin-bottom: 4px; }
    .cloud-backup-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }

    .app { max-width: 720px; margin: 0 auto; padding: 0 16px 110px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 2px 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; background: var(--text); color: var(--bg);
      display: inline-flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; letter-spacing: -1px;
      flex-shrink: 0;
      text-decoration: none; /* 作为返回主页链接时去掉下划线 */
    }
    a.brand-mark:hover { opacity: 0.85; }
    a.brand-mark:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 12px; }
    .home-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px; color: var(--dim); text-decoration: none;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
      min-height: 36px; transition: color 150ms ease, border-color 150ms ease;
    }
    .home-link:hover { color: var(--text); border-color: var(--line-soft); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 17px; font-weight: 750; line-height: 1.2; }
    .brand-sub { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-top: 2px; }
    /* 阶段一：plan 徽章（顶部，不打扰） */
    .plan-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      border: 1px solid var(--line); color: var(--sub); border-radius: 999px;
      padding: 2px 9px; margin-left: 10px; vertical-align: 2px; white-space: nowrap;
    }
    .plan-badge.pro { border-color: var(--yellow); color: var(--yellow); }
    .top-date { text-align: right; font-size: 14px; color: var(--sub); line-height: 1.5; font-variant-numeric: tabular-nums; }

    .view { display: none; animation: fadeIn 200ms ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .kicker { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sub); margin-bottom: 10px; }
    .page-title { font-size: 26px; line-height: 1.25; font-weight: 750; margin-bottom: 8px; letter-spacing: -0.01em; }
    .page-sub { color: var(--sub); font-size: 14px; line-height: 1.6; margin-bottom: 22px; }
    .page-sub strong { color: var(--text); font-weight: 650; }

    .card { border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; margin-bottom: 16px; background: var(--card); }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .card-sub { font-size: 14px; color: var(--sub); line-height: 1.6; }

    .notice { border: 1px solid var(--line); border-left: 3px solid var(--yellow); border-radius: 12px; background: var(--yellow-bg); padding: 13px 16px; font-size: 14px; line-height: 1.6; color: #f0d9a8; margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start; }
    .notice a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .notice .notice-x { margin-left: auto; color: var(--sub); font-size: 16px; flex-shrink: 0; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: var(--bg); border: none; border-radius: 12px;
      padding: 13px 22px; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: opacity 150ms ease, transform 150ms ease; min-height: 52px; width: 100%;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--sub); }
    .btn-ghost:hover { border-color: #555; opacity: 1; }
    .btn-sm { min-height: 44px; padding: 8px 14px; font-size: 14px; width: auto; border-radius: 8px; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn-row .btn { flex: 1; min-width: 120px; }

    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 14px; min-height: 44px; color: var(--sub); background: transparent; transition: border-color 150ms ease, color 150ms ease, background 150ms ease; }
    .chip.active { border-color: var(--text); color: var(--text); background: #141414; }

    .mode-card { border-radius: 16px; padding: 22px; margin-bottom: 16px; border: 1px solid; }
    .mode-red { border-color: rgba(229,72,77,0.5); background: var(--red-bg); }
    .mode-yellow { border-color: rgba(242,177,60,0.5); background: var(--yellow-bg); }
    .mode-green { border-color: rgba(70,167,88,0.5); background: var(--green-bg); }
    .mode-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .mode-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .mode-red .mode-dot { background: var(--red); } .mode-yellow .mode-dot { background: var(--yellow); } .mode-green .mode-dot { background: var(--green); }
    .mode-name { font-size: 18px; font-weight: 750; }
    .mode-time { font-size: 14px; color: var(--sub); margin-left: auto; white-space: nowrap; }
    .mode-rule { font-size: 14px; line-height: 1.7; opacity: 0.92; }

    .q-list { display: flex; flex-direction: column; gap: 12px; }
    .q-item { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--card2); }
    .q-text { font-size: 16px; font-weight: 650; line-height: 1.5; margin-bottom: 12px; }
    .q-hint { font-size: 14px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
    .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .q-opt { border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; font-size: 14px; color: var(--sub); background: transparent; transition: border-color 150ms ease, background 150ms ease, color 150ms ease; min-height: 48px; }
    .q-opt.active { border-color: var(--text); background: #141414; color: var(--text); font-weight: 650; }

    .preview { border: 1px dashed #3a3a38; border-radius: 14px; padding: 16px; margin-top: 16px; font-size: 14px; color: var(--sub); }
    .preview b { color: var(--text); }

    .action-card { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--card); margin-bottom: 16px; }
    .action-tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); }
    .tag-cat-content { color: #7fb5f0; border-color: rgba(127,181,240,0.35); }
    .tag-cat-service { color: #e0a86a; border-color: rgba(224,168,106,0.35); }
    .tag-cat-evidence { color: #c68fe2; border-color: rgba(198,143,226,0.35); }
    .tag-cat-product { color: #6fd3c7; border-color: rgba(111,211,199,0.35); }
    .tag-cat-review { color: #a8a8a5; border-color: rgba(168,168,165,0.35); }
    .tag-cat-learn { color: #f2b13c; border-color: rgba(242,177,60,0.35); }
    .action-title { font-size: 18px; font-weight: 750; line-height: 1.4; margin-bottom: 8px; }
    .action-out { font-size: 14px; color: var(--sub); line-height: 1.7; background: var(--card2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
    .action-out b { color: var(--text); font-weight: 650; }
    .action-meta { display: flex; gap: 14px; font-size: 14px; color: var(--dim); margin-bottom: 12px; }
    .done-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 14px; font-weight: 700; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--card); }
    .stat-num { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 14px; color: var(--sub); margin-top: 4px; }
    .stat-num.red { color: var(--red); } .stat-num.yellow { color: var(--yellow); } .stat-num.green { color: var(--green); }
    @media (max-width: 480px) { .stat-grid { grid-template-columns: 1fr 1fr; } }

    .funnel { display: flex; flex-direction: column; gap: 10px; }
    .funnel-row { display: grid; grid-template-columns: 44px 1fr 30px; align-items: center; gap: 10px; }
    .funnel-name { font-size: 14px; color: var(--sub); }
    .funnel-track { height: 20px; background: var(--card2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line-soft); }
    .funnel-fill { height: 100%; background: var(--text); border-radius: 6px; transition: width 300ms ease; }
    .funnel-num { font-size: 14px; font-weight: 700; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
    .funnel-note { font-size: 14px; color: var(--dim); margin-top: 12px; line-height: 1.6; }

    .rec-list { display: flex; flex-direction: column; gap: 12px; }
    .rec-item { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--card); }
    .rec-head { display: flex; align-items: flex-start; gap: 10px; }
    .rec-type { flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 6px; background: #141414; border: 1px solid var(--line); color: var(--sub); margin-top: 2px; }
    .rec-body { flex: 1; min-width: 0; }
    .rec-title { font-size: 16px; font-weight: 650; line-height: 1.5; }
    .rec-content { font-size: 14px; color: var(--sub); line-height: 1.6; margin-top: 4px; word-break: break-word; }
    .rec-foot { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--dim); margin-top: 8px; }
    .rec-del { margin-left: auto; color: var(--dim); font-size: 14px; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 8px 10px; border-radius: 8px; flex-shrink: 0; }
    .rec-del:hover { color: var(--red); }

    .mainline-card { border: 1px solid var(--line); border-radius: 16px; padding: 26px 22px; background: var(--card); margin-bottom: 16px; text-align: center; }
    .mainline-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .mainline-dates { font-size: 14px; color: var(--dim); margin-bottom: 18px; }
    .mainline-days { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .mainline-days small { font-size: 16px; font-weight: 600; color: var(--sub); }
    .mainline-progress-wrap { margin: 18px 0 6px; }
    .mainline-progress { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line-soft); }
    .mainline-progress-fill { height: 100%; background: var(--text); border-radius: 99px; transition: width 300ms ease; }
    .mainline-progress-label { font-size: 14px; color: var(--dim); margin-top: 8px; }

    .check-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: var(--card2); }
    .check-item-title { font-size: 14px; font-weight: 650; line-height: 1.5; }
    .check-item-sub { font-size: 14px; color: var(--dim); margin-top: 3px; }
    .check-opts { display: flex; gap: 8px; margin-top: 10px; }
    .check-opt { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 6px; text-align: center; font-size: 14px; color: var(--sub); min-height: 44px; }
    .check-opt.active { border-color: var(--text); color: var(--text); background: #141414; font-weight: 650; }
    .result-box { border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; text-align: center; }
    .result-box.ok { border-color: rgba(70,167,88,0.5); background: var(--green-bg); }
    .result-box.warn { border-color: rgba(242,177,60,0.5); background: var(--yellow-bg); }
    .result-big { font-size: 34px; font-weight: 800; }
    .result-text { font-size: 14px; color: var(--sub); margin-top: 6px; line-height: 1.6; }

    .mode-dist { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .mode-dist-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; background: var(--card2); }
    .mode-dist-num { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .mode-dist-label { font-size: 14px; color: var(--sub); margin-top: 2px; }

    .empty { text-align: center; padding: 42px 20px; color: var(--dim); font-size: 14px; line-height: 1.8; }
    .empty .empty-ico { font-size: 34px; margin-bottom: 10px; opacity: 0.6; }
    .link { color: var(--text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .muted { color: var(--dim); }
    .divider { border: none; border-top: 1px solid var(--line-soft); margin: 18px 0; }

    .seg { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
    .seg button { flex: 1; padding: 12px 0; font-size: 14px; color: var(--sub); background: var(--card); }
    .seg button.active { background: var(--text); color: var(--bg); font-weight: 700; }

    /* 弹层 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.66); display: flex; align-items: flex-end; justify-content: center; z-index: 100; animation: fadeIn 150ms ease; padding-bottom: 61px; padding-bottom: calc(61px + env(safe-area-inset-bottom, 0px)); }
    @media (min-width: 560px) { .modal-mask { align-items: center; padding-bottom: 0; } }
    .modal { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 22px; }
    @media (min-width: 560px) { .modal { border-radius: 20px; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-size: 17px; font-weight: 750; }
    .modal-x { color: var(--sub); font-size: 20px; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; }
    .field { margin-bottom: 14px; }
    .field-label { font-size: 14px; color: var(--sub); margin-bottom: 6px; display: block; }
    .field-hint { font-size: 14px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
    /* 阶段一：账号与 Pro（设置页） */
    .device-row { display: flex; gap: 8px; align-items: center; }
    /* v1.18.0：设备码对用户隐藏，device-row 样式不再使用（保留占位避免误删其它引用） */
    .plan-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--sub); }
    .plan-chip.pro { border-color: var(--yellow); color: var(--yellow); }
    .plan-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .plan-chip.pro .dot { background: var(--yellow); }
    .privacy-note { font-size: 12px; color: var(--dim); line-height: 1.7; margin-top: 6px; }
    .pro-card { border-color: rgba(242,177,60,0.4); }
    .pro-price { font-size: 15px; font-weight: 700; margin: 4px 0 10px; }
    .pro-perks { margin: 4px 0 12px; padding: 0; list-style: none; }
    .pro-perks li { font-size: 13px; color: var(--sub); padding: 4px 0 4px 22px; position: relative; }
    .pro-perks li:before { content: "✓"; position: absolute; left: 2px; color: var(--yellow); font-weight: 700; }
    .pro-qr-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin: 12px 0 6px; }
    .pro-qr-box { text-align: center; flex-shrink: 0; }
    .pro-qr-box img { width: 132px; height: 156px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; display: block; }
    .pro-qr-box span { display: block; font-size: 12px; color: var(--dim); margin-top: 6px; }
    .pro-steps { flex: 1; min-width: 200px; font-size: 13px; color: var(--sub); line-height: 1.9; }
    .pro-steps b { color: var(--text); }
    .pro-steps code { font-size: 12px; background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; word-break: break-all; }
    .pro-ok { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--yellow); margin-bottom: 6px; }
    .pro-coming { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; margin: 2px 0 4px; }
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .type-toggle button { border: 1px solid var(--line); border-radius: 10px; padding: 11px; text-align: center; font-size: 14px; min-height: 44px; color: var(--sub); background: var(--card2); }
    .type-toggle button.active { border-color: var(--text); background: #141414; color: var(--text); font-weight: 700; }
    .subtype-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .heatmap-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; background: var(--card2); margin-top: 14px; position: relative; }

<script>
(function () {
  'use strict';

  /* ================= 数据层（localStorage 单一 JSON 根） ================= */
  var LS_KEY = 'transition-os:v1';
  var todayStr = (function () {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  })();

  function pad(n) { return String(n).padStart(2, '0'); }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }
  function nowISO() { return new Date().toISOString(); }
  function parseDate(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return fmt(d); }
  function diffDays(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
  function prettyDate(s) { var d = parseDate(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK_CN[d.getDay()]; }
  function mondayOf(s) { var d = parseDate(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmt(d); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function emptyDB() {
    return {
      // v1.17.0：name 遗留硬编码改为 ''（消除 masterlinc 身份泄漏红线）；
      // 新增 nickname/onboarded/onboardedAt/privacy（首次引导数据模型，见技术方案 §1）。
      user: { id: uid(), name: '', stage: 'validate', plan: 'free', email: '', planNote: '', nickname: '', onboarded: false, onboardedAt: null, privacy: null, createdAt: nowISO() },
      mainline: null,
      dailySessions: [],
      assets: [],
      evidences: [],
      weeklyReviews: [],
      learnNotes: [], // v1.18.0：学习笔记（提升记录），独立于资产/证据，通过转资产/转证据沉淀
      meta: { lastExportAt: null, backupDismissDate: null, profileTipDismissDate: null, shownWelcomeIds: [], createdAt: nowISO() }
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var d = JSON.parse(raw); if (d && d.user) return normalize(d); }
    } catch (e) {}
    var d = emptyDB();
    save(d);
    return d;
  }
  function normalize(d) {
    if (!d.meta) d.meta = { lastExportAt: null, backupDismissDate: null, createdAt: nowISO() };
    if (!d.user) d.user = emptyDB().user;
    if (!d.user.plan) d.user.plan = 'free';           // 阶段一：plan 开关（老数据迁移默认 free）
    if (d.user.email == null) d.user.email = '';       // 阶段一：邮箱钩子（只存不验证）
    if (!d.user.planNote) d.user.planNote = '';        // 阶段一：解锁备注
    // v1.17.0 首次引导数据迁移：老用户无新字段 → 补默认值（onboarded=false 触发一次性补填）
    if (d.user.nickname == null) d.user.nickname = '';          // 昵称：'' = 未填；渲染时用「转型者」兜底
    if (d.user.onboarded == null) d.user.onboarded = false;     // 引导完成标记：false → 下次打开走引导/补填
    if (d.user.onboardedAt == null) d.user.onboardedAt = null;  // 引导完成时间 ISO
    if (d.user.privacy == null) d.user.privacy = null;          // 个保法同意记录 { agreedAt, version }
    if (d.meta.profileTipDismissDate == null) d.meta.profileTipDismissDate = null; // 老用户补填提示条关闭日期
    if (!Array.isArray(d.meta.shownWelcomeIds)) d.meta.shownWelcomeIds = [];        // 里程碑欢迎语去重
    if (!Array.isArray(d.dailySessions)) d.dailySessions = [];
    if (!Array.isArray(d.assets)) d.assets = [];
    if (!Array.isArray(d.evidences)) d.evidences = [];
    if (!Array.isArray(d.weeklyReviews)) d.weeklyReviews = [];
    if (!Array.isArray(d.learnNotes)) d.learnNotes = []; // v1.18.0：老数据自动补空数组
    return d;
  }
  function save(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) { toast('存储失败：空间不足或浏览器限制'); } }

  var db = load();

  /* ================= 阶段一：plan 开关框架（免费/付费） =================
   * db.user.plan = 'free' | 'pro'（默认 free，老数据迁移见 normalize）。
   * isPro() 供所有需要判断权益的前端逻辑使用；PRO_KEYS 为验证期预置激活码，
   * 付款后由 masterlinc 人工发放，用户输入匹配即解锁（验证期最简单方案）。
   */
  var PRO_KEYS = ['PRO-2026-001', 'PRO-2026-002', 'PRO-2026-003'];
  function isPro() {
    return !!(db.user && db.user.plan === 'pro');
  }

  /* ================= 云备份（云端匿名快照 · 自动实时） =================
   * 目标：用户零手动操作，数据自动备份到云端 + 本地镜像（Obsidian）。
   * 机制：每次 persist() → save 本地后 3 秒节流合并 → POST /api/backup
   *       服务端写入云端备份存储。网络失败静默，本地数据不受影响，
   *       下次 persist 自动重试；云端备份成功后把状态写回 meta（直接 save，不触发再备份）。
   * 隐私：数据含个人产出，云端备份仅用于防丢失；前端不暴露任何凭证，只同域调 /api/backup。
   */
  var BACKUP_API = '/api/backup';
  // 阶段一：设备 ID 匿名 —— 备份标识改为 db.user.id（每浏览器首次生成，各设备数据独立），
  // 不再共用硬编码 masterlinc；历史 legacy 备份保留，可在恢复框手动输入 masterlinc 找回。
  function backupUserId() {
    return (db && db.user && db.user.id) ? db.user.id : 'masterlinc';
  }
  var BACKUP_VERSION = '1.18.2';
  var BACKUP_DEBOUNCE_MS = 3000; // 3 秒内合并多次 persist 为一次上传
  var backupTimer = null;
  var backupInFlight = false;

  function scheduleBackup() {
    if (db.meta.cloudBackupDisabled) return;
    if (backupTimer) clearTimeout(backupTimer);
    backupTimer = setTimeout(flushBackup, BACKUP_DEBOUNCE_MS);
  }
  function flushBackup() {
    backupTimer = null;
    if (backupInFlight) return; // 上一次还在传，等下次 persist 再触发
    doBackup();
  }
  function doBackup() {
    if (!db || !db.user || backupInFlight) return;
    backupInFlight = true;
    var payload = { db: db, userId: backupUserId(), version: BACKUP_VERSION, ts: Date.now() };
    fetch(BACKUP_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      keepalive: true // 页面关闭时也尽量发出
    }).then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (data) {
        backupInFlight = false;
        if (data && data.ok) {
          db.meta.lastCloudBackupAt = nowISO();
          db.meta.lastCloudBackupType = data.snapshotType || 'full';
          db.meta.cloudBackupStatus = 'ok';
          if (data.truncated) toast('云端备份完成（数据量大，已存核心摘要）');
        } else {
          db.meta.cloudBackupStatus = 'failed';
          db.meta.lastCloudBackupFailAt = nowISO();
        }
        save(db); // 直接 save，不触发 scheduleBackup，避免循环
      })
      .catch(function () {
        backupInFlight = false;
        db.meta.cloudBackupStatus = 'offline';
        db.meta.lastCloudBackupFailAt = nowISO();
        save(db); // 静默失败：本地数据正常，下次 persist 自动重试
      });
  }

  function persist() { save(db); scheduleBackup(); }

  function cloudBackupStatusText() {
    if (db.meta.cloudBackupDisabled) return '自动备份已关闭，可在下方重新开启。';
    var s = db.meta.cloudBackupStatus;
    var at = db.meta.lastCloudBackupAt;
    var t = at ? at.slice(0, 16).replace('T', ' ') : '从未备份';
    if (s === 'ok') return '上次云端备份：' + t + ' · 已安全保存到云端';
    if (s === 'offline') return '上次云端备份未成功：' + t + '（离线或服务不可用；本地数据不受影响，下次自动重试）';
    if (s === 'failed') return '上次云端备份失败：' + t + '（本地数据不受影响）';
    return '尚未执行过云端备份。';
  }

  function lastSessionDate() {
    var best = null;
    db.dailySessions.forEach(function (s) { if (!best || s.date > best) best = s.date; });
    return best;
  }
  function sessionOf(dateStr) {
    return db.dailySessions.filter(function (s) { return s.date === dateStr; })[0] || null;
  }

  /* ================= 规则引擎：红黄绿日 ================= */
  var MODE_META = {
    red:    { name: '红日', time: '3 分钟', dot: 'red',    rule: '只做一个 3 分钟的小动作，做完就收。约束：不研究、不润色、不补欠账。今天你的任务是恢复系统，不是推进项目。' },
    yellow: { name: '黄日', time: '15 分钟', dot: 'yellow', rule: '只做一个 15 分钟的动作，别贪多。约束：会议多、精力散，先护住一段完整时间，做完即记录。' },
    green:  { name: '绿日', time: '60 分钟', dot: 'green',  rule: '今天状态好，把最多时间投给高杠杆动作（产品/内容/服务交付）。约束：仍然只推进一件事，做完沉淀。' }
  };
  function decideMode(a) {

    if (a.meetingsOver4) return 'yellow';
    return 'green';
  }
  function autoGap() {
    var last = lastSessionDate();

    var pool = ACTIONS.filter(function (a) { return a.modes.indexOf(mode) >= 0 && a.stages.indexOf(stage) >= 0; });
    var recentIds = {};
    for (var i = 1; i <= 3; i++) {
      var ds = addDays(todayStr, -i);
      db.dailySessions.forEach(function (s) { if (s.date === ds && s.actionId) recentIds[s.actionId] = true; });
    }
    var candidates = pool.filter(function (a) { return !recentIds[a.id]; });
    if (!candidates.length) candidates = pool;
    candidates.sort(function (x, y) {
      var sx = score(x), sy = score(y);
      return sy - sx;
    });
    if (excludeFirst) {
      var rest = candidates.filter(function (a) { return a.id !== excludeFirst; });
      if (rest.length) return rest.concat(candidates.slice(0, 1));
      return candidates;
    }
    return candidates;
  }
  function score(a) {
    var done = lastDoneDays(a.id);
    var recency = (done === null) ? 2 : Math.min(done, 14) / 7;
    return a.priority * 2 + recency;

  function switchAction() {
    var s = sessionOf(todayStr);
    if (!s) return;
    // v1.18.2 修复：轮转不再依赖 score 动态排序，改用「固定候选池顺序」取下一个。
    // 旧实现（v1.18.0）每次按 recommendList 排序后取当前动作的下一个：切换后该动作被
    // 写入当天 session → lastDoneDays=0 → score 骤降 → 下次排序变化 → 指针重置，
    // 最终收敛到 2-3 个高分动作死循环，学习类动作（a-learn-*）永远轮不到。
    // 现在：候选池 = 当前模式+阶段 的全部动作（排除近 3 天已做，与 recommendList 口径一致），
    // 按 ACTIONS 声明顺序固定排列，轮转指针稳定 → 连续点「换一个」必能遍历池内所有动作。
    // 「确认完成」后的 recency 降权逻辑不受影响（仍由 recommendList/score 负责推荐首动作）。
    // 注意：阶段取 db.user.stage（session 无 stage 字段）。
    var pool = ACTIONS.filter(function (a) {
      return a.modes.indexOf(s.mode) >= 0 && a.stages.indexOf(db.user.stage) >= 0;
    });
    var recentIds = {};
    for (var i = 1; i <= 3; i++) {
      var ds = addDays(todayStr, -i);
      db.dailySessions.forEach(function (x) { if (x.date === ds && x.actionId) recentIds[x.actionId] = true; });
    }
    var cand = pool.filter(function (a) { return !recentIds[a.id]; });
    if (!cand.length) cand = pool;
    if (!cand.length) { render(); return; }
    var idx = 0;
    for (var i = 0; i < cand.length; i++) { if (cand[i].id === s.actionId) { idx = i; break; } }
    var next = cand[(idx + 1) % cand.length];
    s.actionId = next.id;
    s.output = '';
    s.assetIds = [];
    s.evidenceIds = [];
    persist();
    render();
  }

    var items = weekOutputs(monday, todayStr);

      var total = wr.mainlineCheck.length;

        var typeCn = it.kind === 'asset' ? ((ASSET_TYPES.filter(function (x) { return x.v === it.type; })[0] || {}).n || '资产') : ((EVIDENCE_TYPES.filter(function (x) { return x.v === it.type; })[0] || {}).n || '证据');
        var val = mainlineCheckState[it.id] || '';
        h += '<div class="check-item"><div class="check-item-title">' + esc(name) + '</div>';
        h += '<div class="check-item-sub">' + (it.kind === 'asset' ? '资产 · ' : '证据 · ') + typeCn + ' · ' + prettyDate(it.createdAt.slice(0, 10)) + '</div>';

  function weekOutputs(from, to) {
    var out = [];
    db.assets.forEach(function (a) {
      var d = a.createdAt.slice(0, 10);
      if (d >= from && d <= to) out.push({ id: a.id, kind: 'asset', type: a.type, title: a.title, content: a.content, createdAt: a.createdAt });
    });
    db.evidences.forEach(function (e) {
      var d = e.createdAt.slice(0, 10);
      if (d >= from && d <= to) out.push({ id: e.id, kind: 'evidence', type: e.type, title: '', content: e.content, createdAt: e.createdAt });
    });
    return out.sort(function (x, y) { return x.createdAt.localeCompare(y.createdAt); });
  }

  function finishMainlineCheck() {
    var monday = mondayOf(todayStr);
    var items = weekOutputs(monday, todayStr);
    var marks = [];
    items.forEach(function (it) {
      var v = mainlineCheckState[it.id];
      if (v) marks.push({ item: (it.kind === 'asset' ? it.title : it.content).slice(0, 60), onMainline: v === 'on' });
    });
    if (!marks.length) { toast('请至少给一条产出打标'); return; }
    var on = marks.filter(function (m) { return m.onMainline; }).length;
    var ratio = Math.round(on / marks.length * 100);
    var wr = {
      id: uid(), weekStart: monday,
      stats: { streakDays: streak(), assetsAdded: db.assets.filter(function (a) { var d = a.createdAt.slice(0, 10); return d >= monday && d <= todayStr; }).length, evidencesAdded: db.evidences.filter(function (e) { var d = e.createdAt.slice(0, 10); return d >= monday && d <= todayStr; }).length, modeDistribution: modeDist(monday, todayStr), mainlineConsistency: ratio / 100 },
      mainlineCheck: marks, notes: '', createdAt: nowISO()
    };
    db.weeklyReviews = db.weeklyReviews.filter(function (r) { return r.weekStart !== monday; });
    db.weeklyReviews.push(wr);
    mainlineCheckState = {};
    persist();
    toast('一致性 ' + ratio + '% · ' + (ratio >= 70 ? '合格' : '该收心了'));
    render();
  }

  var reviewRange = 'week';

  function streak() {
    var count = 0;
    var d = todayStr;
    if (!sessionOf(d)) d = addDays(d, -1);
    while (sessionOf(d)) { count++; d = addDays(d, -1); }
    return count;
  }
  function modeDist(from, to) {
    var m = { red: 0, yellow: 0, green: 0 };
    db.dailySessions.forEach(function (s) { if (s.date >= from && s.date <= to) m[s.mode] = (m[s.mode] || 0) + 1; });
    return m;
  }
  function rangeStats() {
    var from, to, label;
    if (reviewRange === 'week') {
      from = mondayOf(todayStr); to = todayStr; label = '本周';
    } else {
      var now = new Date();
      var py = now.getFullYear(), pm = now.getMonth() - 1;
      if (pm < 0) { pm = 11; py--; }
      from = py + '-' + pad(pm + 1) + '-01';
      to = fmt(new Date(py, pm + 1, 0));
      label = '上月';
    }
    return { from: from, to: to, label: label };
  }

    db.meta.lastExportAt = nowISO();

    var blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'transition-os-backup-' + todayStr + '.json';

  // CSV 字段转义：含逗号 / 引号 / 换行时用双引号包裹，内部引号翻倍
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function streakUntil(d) {
    if (d > todayStr) d = todayStr;
    var count = 0;
    while (sessionOf(d)) { count++; d = addDays(d, -1); }
    return count;
  }

  // 导出数据报告（人类可读 CSV，含 UTF-8 BOM，Excel/WPS 中文不乱码）
  // 与 JSON 备份分工：JSON 用于导入恢复，CSV 用于查看 / 带走 / 分享给教练。
  function exportReport() {
    db.meta.lastExportAt = nowISO();
    persist();
    var L = [];
    function row(cells) { L.push(cells.map(csvCell).join(',')); }
    function section(name) { row(['[' + name + ']']); }
    function blank() { L.push(''); }

    // 1. 总览
    section('总览');
    row(['字段', '值']);
    row(['数据标识', (db.user.nickname || '').trim() || '—']);
    row(['绑定邮箱', db.user.email || '']);
    row(['转型阶段', STAGE_CN[db.user.stage] || db.user.stage]);
    row(['创建时间', (db.user.createdAt || '').slice(0, 19).replace('T', ' ')]);
    if (db.mainline) {
      row(['母线名称', db.mainline.name]);
      row(['母线开始日期', db.mainline.startDate]);
      row(['母线剩余天数', Math.max(0, diffDays(todayStr, addDays(db.mainline.startDate, MAINLINE_DAYS)))]);
    } else {
      row(['母线名称', '（未设定）']);
    }
    row(['连续执行天数', streak()]);
    row(['资产数', db.assets.length]);
    row(['证据数', db.evidences.length]);
    row(['学习笔记数', db.learnNotes.length]);
    blank();

    // 2. 资产清单
    section('资产清单');
    row(['日期', '标题', '类型', '内容']);
    var assetsSorted = db.assets.slice().sort(function (x, y) { return (x.createdAt || '').localeCompare(y.createdAt || ''); });
    if (!assetsSorted.length) row(['（暂无）', '', '', '']);
    assetsSorted.forEach(function (a) {
      var t = ASSET_TYPES.filter(function (x) { return x.v === a.type; })[0];
      row([(a.createdAt || '').slice(0, 10), a.title || '', t ? t.n : a.type, a.content || '']);
    });
    blank();

    // 3. 证据清单
    section('证据清单');
    row(['日期', '标题', '类型', '内容', '来源', '漏斗阶段']);
    var evsSorted = db.evidences.slice().sort(function (x, y) { return (x.createdAt || '').localeCompare(y.createdAt || ''); });
    if (!evsSorted.length) row(['（暂无）', '', '', '', '', '']);
    evsSorted.forEach(function (e) {
      var t = EVIDENCE_TYPES.filter(function (x) { return x.v === e.type; })[0];
      var st = e.funnelStage || funnelOf(e.type);
      var stName = '';
      if (st) { var f = FUNNEL.filter(function (x) { return x.key === st; })[0]; stName = f ? f.name : st; }
      row([(e.createdAt || '').slice(0, 10), '', t ? t.n : e.type, e.content || '', e.source || '', stName]);
    });
    blank();

    // 3.5 学习笔记（提升记录，v1.18.0）
    section('学习笔记');
    row(['日期', '来源', '导师', '主题', '收获', '应用', '状态']);
    var notesSorted = db.learnNotes.slice().sort(function (x, y) { return (x.date || '').localeCompare(y.date || ''); });
    if (!notesSorted.length) row(['（暂无）', '', '', '', '', '', '']);
    notesSorted.forEach(function (n) {
      var stName = n.applyStatus === 'done' ? '已应用' : (n.applyStatus === 'dropped' ? '已放弃' : '待应用');
      row([(n.date || (n.createdAt || '')).slice(0, 10), n.sourceTitle || '', n.mentor ? learnMentorName(n.mentor) : '', n.theme ? learnThemeName(n.theme) : '', n.harvest || '', n.apply || '', stName]);
    });
    blank();

    // 4. 每日执行记录（最近 14 天）
    section('每日执行记录（最近 14 天）');
    row(['日期', '模式', '是否完成', '动作标题']);
    var dayRows = [];
    for (var i = 13; i >= 0; i--) {
      var d = addDays(todayStr, -i);
      var s = sessionOf(d);
      if (s) {
        var done = !!(s.output || (s.assetIds && s.assetIds.length) || (s.evidenceIds && s.evidenceIds.length));
        var actTitle = '';
        if (s.actionId) { var act = actionById(s.actionId); if (act) actTitle = act.title; }
        else if (s.customAction) actTitle = s.customAction;
        dayRows.push([d, MODE_META[s.mode] ? MODE_META[s.mode].name : s.mode, done ? '是' : '否', actTitle]);
      }
    }
    if (!dayRows.length) row(['（最近 14 天无执行记录）', '', '', '']);
    else dayRows.forEach(function (r) { row(r); });
    blank();

    // 5. 每周复盘（最近 8 周）
    section('每周复盘（最近 8 周）');
    row(['周开始日期', '连续天数', '资产新增', '证据新增', '母线一致性']);
    var monday = mondayOf(todayStr);
    for (var w = 7; w >= 0; w--) {
      var ws = addDays(monday, -w * 7);
      var we = addDays(ws, 6);
      if (ws > todayStr) continue;
      var wr = db.weeklyReviews.filter(function (r) { return r.weekStart === ws; })[0] || null;
      var streakD, aAdd, eAdd, cons;
      if (wr && wr.stats) {
        streakD = wr.stats.streakDays != null ? wr.stats.streakDays : streakUntil(Math.min(we, todayStr));
        aAdd = wr.stats.assetsAdded != null ? wr.stats.assetsAdded : 0;
        eAdd = wr.stats.evidencesAdded != null ? wr.stats.evidencesAdded : 0;
        cons = (typeof wr.stats.mainlineConsistency === 'number') ? Math.round(wr.stats.mainlineConsistency * 100) + '%' : '';
      } else {
        streakD = streakUntil(Math.min(we, todayStr));
        aAdd = db.assets.filter(function (a) { var d = (a.createdAt || '').slice(0, 10); return d >= ws && d <= we; }).length;
        eAdd = db.evidences.filter(function (e) { var d = (e.createdAt || '').slice(0, 10); return d >= ws && d <= we; }).length;
        cons = '';
      }
      row([ws, streakD, aAdd, eAdd, cons]);
    }
    blank();

    var csv = '\uFEFF' + L.join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'transition-os-report-' + todayStr + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('已导出数据报告');
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.user) throw new Error('bad');
        db = normalize(parsed);
        persist();
        toast('导入成功');
        render();
      } catch (e) { toast('导入失败：不是有效的备份文件'); }
    };
    reader.readAsText(file);
  }

  // 从云端读取最新快照并覆盖本地。需要恢复口令
  // （口令由服务端人工发放），口令不写入前端代码，只在用户输入时使用。
  function cloudRestore() {
    var mask = openModal(
      '<p class="muted" style="font-size:14px;margin-bottom:10px;">读取云端的最新备份，覆盖当前本地数据（换设备 / 清缓存 / 数据丢失时使用）。需要输入恢复口令。</p>' +
      '<div class="field"><label class="field-label" for="restoreKey">恢复口令</label><input id="restoreKey" type="password" placeholder="请输入恢复口令" autocomplete="off"></div>' +
      '<p class="muted" style="font-size:12px;margin:-6px 0 12px;">系统会自动使用当前设备的数据标识读取云端快照，无需你手动输入。</p>' +
      '<div class="btn-row"><button class="btn" id="restoreDo">读取并覆盖</button><button class="btn-ghost" data-action="modal-close">取消</button></div>'
    );
    modalTitle('从云端恢复');
    $id('restoreDo').addEventListener('click', function () {
      var key = $id('restoreKey').value.trim();
      var u = backupUserId(); // v1.18.0：恢复标识内部仍用设备码（db.user.id），但用户层面隐藏，无需输入
      if (!key) { toast('请输入恢复口令'); return; }
      fetch(BACKUP_API + '?op=latest&userId=' + encodeURIComponent(u), {
        headers: { 'x-backup-key': key }
      })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (data) {
          if (!data || !data.ok || !data.data) {
            toast(data && data.message ? '云端读取失败：' + data.message : '云端读取失败');
            return;
          }
          var snapshot = null;
          try { snapshot = JSON.parse(data.data.snapshot); } catch (e) { snapshot = null; }
          if (!snapshot || !snapshot.user) { toast('云端快照格式异常'); return; }
          var backupTime = data.data.backupTime ? new Date(data.data.backupTime).toLocaleString() : '未知时间';
          var summary = data.data.summary || '';
          closeModal();
          confirmModal('覆盖确认', '将用云端快照（' + backupTime + '）覆盖本地数据。\n' + esc(summary) + '\n\n确认继续？', '覆盖', function () {
            db = normalize(snapshot);
            persist(); // 恢复后自动触发一次新备份，正常
            render();
            toast('已从云端恢复');
          });
        })
        .catch(function () { toast('网络错误，无法连接云端'); });
    });
  }
  function confirmModal(title, text, yesLabel, onYes) {
    var mask = openModal('<p class="muted" style="font-size:14px;margin-bottom:18px;">' + esc(text) + '</p><div class="btn-row"><button class="btn" id="confirmYes">' + esc(yesLabel) + '</button><button class="btn-ghost" data-action="modal-close">取消</button></div>');
    modalTitle(title);
    $id('confirmYes').addEventListener('click', function () { closeModal(); onYes(); });
  }
  function resetData() {
    var mask = openModal('<p class="muted" style="font-size:14px;margin-bottom:10px;">输入「重置」两个字确认清空全部数据（不可恢复，请先导出备份）。</p><div class="field"><label class="field-label" for="resetInput">确认输入</label><input id="resetInput" placeholder="重置"></div><div class="btn-row"><button class="btn" id="resetDo">确认清空</button><button class="btn-ghost" data-action="modal-close">取消</button></div>');
    modalTitle('重置全部数据');
    $id('resetDo').addEventListener('click', function () {
      if ($id('resetInput').value.trim() === '重置') { db = emptyDB(); persist(); closeModal(); render(); mountOnboarding(); toast('已重置'); }

  /* ================= 看板页（Dashboard · v1.7.0 新增，只读内存 db，不写 localStorage、不触发备份） ================= */
  // 唯一允许写入 localStorage 的是里程碑去重标记 seenMilestones（视觉方案 4.3）
  var MILESTONE_KEY = 'transition-os:milestones:v1';
  function milestoneBanner() {
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem(MILESTONE_KEY) || '{}') || {}; } catch (e) { seen = {}; }
    var banner = null;
    var st = streak();
    var dMiles = [
      { v: 90, t: '第 90 天 · 一个完整的 90 天周期' },
      { v: 60, t: '第 60 天 · 已连续执行两个月' },
      { v: 30, t: '第 30 天 · 连续执行满一个月' },
      { v: 21, t: '第 21 天 · 三周整，已连续执行三周' },
      { v: 7, t: '第 7 天 · 连续执行一整周' }
    ];
    for (var i = 0; i < dMiles.length && !banner; i++) {
      if (st >= dMiles[i].v && !seen['d' + dMiles[i].v]) { banner = dMiles[i].t; seen['d' + dMiles[i].v] = 1; }
    }
    if (!banner && db.mainline) {
      var elapsed = Math.max(0, Math.min(MAINLINE_DAYS, diffDays(db.mainline.startDate, todayStr)));
      var mMiles = [
        { v: 90, t: '母线已过 90 天 · 一个周期完成，该复盘换轨' },
        { v: 60, t: '母线已过 60 天 · 还剩三分之一' },
        { v: 30, t: '母线已过 30 天 · 还剩三分之二' }
      ];
      for (var j = 0; j < mMiles.length && !banner; j++) {
        if (elapsed >= mMiles[j].v && !seen['m' + mMiles[j].v]) { banner = mMiles[j].t; seen['m' + mMiles[j].v] = 1; }
      }
    }
    if (!banner) {
      var aN = db.assets.length;
      var aMiles = [
        { v: 100, t: '第 100 项资产入账' },
        { v: 50, t: '第 50 项资产入账' },
        { v: 10, t: '第 10 项资产入账' }
      ];
      for (var k = 0; k < aMiles.length && !banner; k++) {
        if (aN >= aMiles[k].v && !seen['a' + aMiles[k].v]) { banner = aMiles[k].t; seen['a' + aMiles[k].v] = 1; }
      }
    }
    if (banner) { try { localStorage.setItem(MILESTONE_KEY, JSON.stringify(seen)); } catch (e) {} }
    return banner;
  }

  function sundayOf(s) { var d = parseDate(s); d.setDate(d.getDate() - d.getDay()); return fmt(d); }

  function dashHeatWeeks() {
    var byDate = {};
    db.dailySessions.forEach(function (s) {
      var c = byDate[s.date] || (byDate[s.date] = { n: 0, mode: s.mode });
      c.n++; c.mode = s.mode;
    });
    var weeks = [];
    var start = sundayOf(todayStr);
    for (var w = 51; w >= 0; w--) {
      var ws = addDays(start, -w * 7);
      var cells = [];
      for (var i = 0; i < 7; i++) {
        var d = addDays(ws, i);
        var info = byDate[d];
        cells.push({ date: d, n: info ? info.n : 0, mode: info ? info.mode : null });
      }
      weeks.push({ start: ws, cells: cells });
    }
    return weeks;
  }

  function dashKpis() {
    var st = streak();
    var s = sessionOf(todayStr);
    var modeCard;
    if (s && MODE_META[s.mode]) {
      var mm = MODE_META[s.mode];
      modeCard = '<div class="stat-card dash-mode mode-' + s.mode + '">' +
        '<div class="mode-top"><span class="mode-dot"></span><span class="mode-name">' + mm.name + '</span></div>' +
        '<div class="stat-label">今日模式 · 约 ' + mm.time + '</div></div>';
    } else {
      modeCard = '<div class="stat-card"><div class="stat-num" style="font-size:22px;">待判断</div>' +
        '<div class="stat-label">今日模式 · <a class="link" data-action="goto-today">去判断 →</a></div></div>';
    }
    return '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-num num-in">' + st + '</div><div class="stat-label">连续执行（天）</div></div>' +
      modeCard +
      '<div class="stat-card"><div class="stat-num num-in" style="color:var(--asset);">' + db.assets.length + '</div><div class="stat-label">累计资产</div></div>' +
      '<div class="stat-card"><div class="stat-num num-in" style="color:var(--evidence);">' + db.evidences.length + '</div><div class="stat-label">累计证据</div></div>' +
      '<div class="stat-card"><div class="stat-num num-in" style="color:var(--yellow);">' + db.learnNotes.length + '</div><div class="stat-label">学习笔记 · 本周 ' + learnWeekCount() + '</div></div>' +
      '<div class="stat-card"><div class="stat-num num-in" style="color:var(--green);">' + learnConvertedCount() + '</div><div class="stat-label">提升转化（转资产/证据）</div></div>' +
      '</div>';
  }

  function dashHeatmap() {
    var weeks = dashHeatWeeks();
    var any = false;
    weeks.forEach(function (w) { w.cells.forEach(function (c) { if (c.n > 0) any = true; }); });
    var months = '', lastMonth = '';
    weeks.forEach(function (w) {
      var m = w.start.slice(0, 7);
      if (m !== lastMonth) { months += '<span>' + parseInt(m.slice(5), 10) + '月</span>'; lastMonth = m; }
      else months += '<span></span>';
    });
    var cells = '';
    weeks.forEach(function (w) {
      w.cells.forEach(function (c) {
        var lvl = c.n >= 3 ? 3 : c.n;
        var title = prettyDate(c.date) + (c.n ? ' · 执行 ' + c.n + ' 次' + (c.mode && MODE_META[c.mode] ? ' · ' + MODE_META[c.mode].name : '') : ' · 未执行');
        var cls = 'heat-cell hm-h' + lvl;
        if (c.date === todayStr) { cls += ' today'; if (lvl > 0) cls += ' lit'; }
        cells += '<div class="' + cls + '" title="' + esc(title) + '">' + (lvl >= 1 && c.mode ? '<i class="hm-dot ' + c.mode.charAt(0) + '"></i>' : '') + '</div>';
      });
    });
    var h = '<div class="card">';
    h += '<div class="card-title">连续执行 · 热力图</div>';
    h += '<p class="card-sub" style="margin-bottom:4px;">最近 52 周，一格一天。默认看最新，可横向滑动回看。</p>';
    h += '<div class="heatmap-wrap">';
    h += '<div class="heatmap-months" aria-hidden="true">' + months + '</div>';
    h += '<div class="heatmap" role="img" aria-label="最近 52 周连续执行热力图，亮度代表执行次数，圆点代表当日模式">' + cells + '</div>';
    if (!any) {
      h += '<div class="heat-empty"><div>完成第一次执行，点亮第一格</div><div class="btn-row"><button class="btn-ghost btn btn-sm" data-action="goto-today">去今日页</button></div></div>';
    }
    h += '</div>';
    h += '<div class="heat-legend"><span>亮度 = 执行强度</span><span class="legend-swatch"><i style="background:var(--red);"></i>红日</span><span class="legend-swatch y"><i></i>黄日</span><span class="legend-swatch g"><i></i>绿日</span><span>圆点 = 当日模式</span></div>';
    h += '</div>';
    return h;
  }

  function dashFunnel() {
    var c = funnelCounts();
    var keys = ['person', 'pain', 'service', 'payment', 'product'];
    var max = 1;
    keys.forEach(function (k) { if (c[k] > max) max = c[k]; });
    var currentIdx = -1;
    for (var i = keys.length - 1; i >= 0; i--) { if (c[keys[i]] > 0) { currentIdx = i; break; } }
    var h = '<div class="card">';
    h += '<div class="card-title">北极星 · 走到哪了</div>';
    if (currentIdx >= 0) {
      var cur = FUNNEL[currentIdx];
      h += '<p class="card-sub" style="margin-bottom:14px;">当前：' + cur.name + ' ' + c[cur.key] + ' 条' + (currentIdx < 4 ? ' · 下一步：' + FUNNEL[currentIdx + 1].name : ' · 已到产品化，专注售卖与反馈循环') + '</p>';
    } else {
      h += '<p class="card-sub" style="margin-bottom:14px;">从一次真实互动开始点亮漏斗。</p>';
    }
    h += '<div class="funnel">';
    FUNNEL.forEach(function (f, idx) {
      var n = c[f.key];
      var reached = currentIdx >= 0 && idx <= currentIdx && n > 0;
      var width = reached ? Math.round(n / max * 100) : 8;
      var fillCls = reached ? 'funnel-fill ff-gold' : 'funnel-fill ff-skel';
      var numCls = reached ? 'funnel-num' : 'funnel-num muted';
      h += '<div class="funnel-row"><div class="funnel-name">' + f.name + '</div>' +
        '<div class="funnel-track"><div class="' + fillCls + '" style="width:' + width + '%;"></div></div>' +
        '<span class="' + numCls + '">' + n + '</span></div>';
    });
    h += '</div>';
    if (currentIdx < 0) h += '<div class="btn-row"><button class="btn-ghost btn btn-sm" data-action="goto-today">去今日页</button></div>';
    h += '</div>';
    return h;
  }

  function dashMainline() {
    var h = '<div class="card">';
    if (!db.mainline) {
      h += '<div class="card-title">给自己定一条 90 天母线</div>';
      h += '<p class="card-sub" style="margin-bottom:14px;">看板的进度基准从这里开始。</p>';
      h += '<div class="btn-row"><button class="btn" data-action="goto-mainline">开始设定 →</button></div>';
    } else {
      var ml = db.mainline;
      var elapsed = Math.max(0, Math.min(MAINLINE_DAYS, diffDays(ml.startDate, todayStr)));
      var remain = Math.max(0, MAINLINE_DAYS - elapsed);
      var pct = Math.round(elapsed / MAINLINE_DAYS * 100);
      h += '<div class="card-title">母线进度</div>';
      h += '<div class="dash-ml-head"><div class="dash-ml-name">' + esc(ml.name) + '</div><div class="dash-ml-days">' + remain + '<small> 天</small></div></div>';
      h += '<div class="mainline-progress"><div class="mainline-progress-fill" style="width:' + pct + '%;"></div></div>';
      h += '<div class="ml-ticks"><div class="ml-tick-now" style="left:calc(' + pct + '% - 1px);"></div></div>';
      h += '<div class="dash-ml-meta">第 ' + Math.min(elapsed + 1, MAINLINE_DAYS) + ' / ' + MAINLINE_DAYS + ' 天 · ' + pct + '% · 已换 ' + (ml.switchedCount || 0) + ' 次</div>';
    }
    h += '</div>';
    return h;
  }

  function dashRatio() {
    var aN = db.assets.length, eN = db.evidences.length, total = aN + eN;
    var h = '<div class="card">';
    h += '<div class="card-title">资产 / 证据占比</div>';
    if (total === 0) {
      h += '<div class="empty" style="padding:24px 12px;"><div class="empty-ico">◈</div>资产和证据，都在这里沉淀。<div class="btn-row" style="justify-content:center;"><button class="btn-ghost btn btn-sm" data-action="goto-today">去做今日动作</button></div></div>';
    } else {
      var aPct = Math.round(aN / total * 100);
      h += '<div class="split-row">';
      h += '<div class="donut" style="background:conic-gradient(var(--asset) 0 ' + aPct + '%, var(--evidence) ' + aPct + '% 100%);"><div class="donut-center"><div><b>' + total + '</b><span>沉淀</span></div></div></div>';
      h += '<div class="dash-legend">';
      h += legendRow('var(--asset)', '资产', aN);
      h += '<div class="legend-sub">' + subCounts('asset') + '</div>';
      h += legendRow('var(--evidence)', '证据', eN);
      h += '<div class="legend-sub">' + subCounts('evidence') + '</div>';
      h += '</div></div>';
      h += '<div class="stack-bar"><div class="sb" style="flex-grow:' + aN + ';background:var(--asset);"></div><div class="sb" style="flex-grow:' + eN + ';background:var(--evidence);"></div></div>';
    }
    h += '</div>';
    return h;
  }
  function legendRow(color, label, n) {
    return '<div class="legend-row"><span class="ld" style="background:' + color + ';"></span>' + label + '<b>' + n + '</b></div>';
  }
  function subCounts(kind) {
    var map = {};
    if (kind === 'asset') db.assets.forEach(function (a) { map[a.type] = (map[a.type] || 0) + 1; });
    else db.evidences.forEach(function (e) { map[e.type] = (map[e.type] || 0) + 1; });
    var defs = kind === 'asset' ? ASSET_TYPES : EVIDENCE_TYPES;
    var parts = defs.map(function (t) { return map[t.v] ? t.n + ' ' + map[t.v] : null; }).filter(Boolean);
    return parts.join(' · ') || '—';
  }

  function renderDashboard() {
    var v = $id('view-dashboard');
    var h = '';
    var banner = milestoneBanner();
    if (banner) h += '<div class="banner-milestone" role="note">' + banner + '</div>';
    // v1.17.0：看板轻问候（方案 4.5；浏览模式昵称空则兜底「转型者」）
    if (!needsOnboarding() || browseMode) {
      h += '<p class="muted" style="font-size:14px;margin:0 0 12px;">' + esc(displayNickname()) + '，你已连续坚持 <b style="color:var(--text);">' + streak() + '</b> 天</p>';
    }
    h += '<p class="kicker">看板 · Dashboard</p>';
    h += '<h2 class="page-title">今天的状态，一眼看清</h2>';
    h += '<p class="page-sub">连续执行 · 最近节奏 · 走到了哪。只呈现事实，不评判。</p>';
    h += '<div class="dash-inner">';
    h += dashKpis();
    h += dashHeatmap();
    h += dashFunnel();
    h += dashMainline();
    h += dashRatio();
    h += '</div>';
    v.innerHTML = h;
    // 热力图默认滚动到最新（最右）
    var wrap = v.querySelector('.heatmap-wrap');
    if (wrap) wrap.scrollLeft = wrap.scrollWidth;
  }

  /* ================= 路由与渲染 ================= */
  var ROUTES = ['dashboard', 'today', 'records', 'mainline', 'review', 'learn', 'settings'];
  function currentRoute() {
    var h = location.hash.replace(/^#\/?/, '');
    return ROUTES.indexOf(h) >= 0 ? h : 'today';
  }
  function render() {
    var route = currentRoute();
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
    var view = $id('view-' + route);
    if (view) view.classList.add('active');
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-route') === route);
      if (t.getAttribute('data-route') === route) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
    $id('topDate').textContent = prettyDate(todayStr) + ' · ' + (db.mainline ? '母线 ' + Math.max(0, diffDays(todayStr, addDays(db.mainline.startDate, MAINLINE_DAYS))) + ' 天' : '未设母线');
    var badge = $id('planBadge');
    if (badge) {
      badge.textContent = isPro() ? 'Pro' : '免费版';
      badge.classList.toggle('pro', isPro());
    }
    if (route === 'dashboard') renderDashboard();
    else if (route === 'today') renderToday();
    else if (route === 'records') renderRecords();
    else if (route === 'mainline') renderMainline();
    else if (route === 'review') renderReview();
    else if (route === 'learn') renderLearn();
    else if (route === 'settings') renderSettings();
    window.scrollTo({ top: 0 });
  }

  /* ================= 事件分发 ================= */
  // v1.17.0 浏览模式：可看不可记。写操作（记录/确认/母线/删除/导出/备份/重置）在浏览模式下被拦截，引导回填写页。
  var BROWSE_BLOCKED = ['confirm-checkin', 'complete-action', 'open-record', 'rec-save',
    'save-mainline', 'change-mainline', 'finish-mainline-check', 'redo-mainline-check', 'ml-mark',
    'del-record', 'export-report', 'export-backup', 'import-backup', 'cloud-restore', 'cloud-backup-now',
    'reset-data',
    'learn-note', 'learn-note-save', 'learn-convert-asset', 'learn-convert-evidence', 'learn-del', 'learn-drop'];
  function handleAction(act, el) {
    if (browseMode && BROWSE_BLOCKED.indexOf(act) >= 0) {
      toast('先完成昵称和邮箱，才能开始记录');
      mountOnboarding(true);
      return;
    }
    switch (act) {
      case 'onboard-prev': goOnboardStep(onboardIndex - 1); break;
      case 'onboard-next': goOnboardStep(onboardIndex + 1); break;
      case 'onboard-submit': onboardSubmit(); break;
      case 'onboard-skip': onboardSkip(); break;
      case 'onboard-browse': onboardBrowse(); break;
      case 'reopen-onboard': mountOnboarding(true); break;
      case 'dismiss-profile-tip': db.meta.profileTipDismissDate = todayStr; persist(); render(); break;
      case 'mini-step': {
        var step = parseInt(el.getAttribute('data-step'), 10);
        var ss = sessionOf(todayStr);
        if (step === 1 || step === 2) { location.hash = '#/today'; window.scrollTo({ top: 0, behavior: 'smooth' }); }
        else if (step === 3) { if (ss) openRecordModal(ss.id, ss.actionId ? actionById(ss.actionId).cat : 'content'); else openRecordModal(null, 'content'); }
        else { location.hash = '#/review'; }
        break;
      }
      case 'q-set': {
        var k = el.getAttribute('data-key'), val = el.getAttribute('data-val') === 'true';
        qForm[k] = val;
        render();
        break;
      }
      case 'confirm-checkin': confirmCheckin(); break;
      case 'edit-today': editToday(); break;
      case 'cancel-edit-today': cancelEditToday(); break;
      case 'override-mode': overrideMode(el.getAttribute('data-mode')); break;
      case 'switch-action': switchAction(); break;
      case 'complete-action': {
        var s = sessionOf(todayStr);
        if (s) openRecordModal(s.id, s.actionId ? actionById(s.actionId).cat : 'content');
        break;
      }
      case 'open-record': {
        var withSession = el.getAttribute('data-session') === '1';
        if (withSession && sessionOf(todayStr)) openRecordModal(sessionOf(todayStr).id, sessionOf(todayStr).actionId ? actionById(sessionOf(todayStr).actionId).cat : 'content');
        else openRecordModal(null, 'content');
        break;
      }
      case 'view-today-output': viewTodayOutput(); break;
      case 'rec-tab': recFilter.tab = el.getAttribute('data-tab'); recFilter.q = ''; render(); break;
      case 'asset-filter': recFilter.assetType = el.getAttribute('data-type'); render(); break;
      case 'evidence-filter': recFilter.evidenceType = el.getAttribute('data-type'); render(); break;
      case 'rec-kind': recSetKind(el.getAttribute('data-kind')); break;
      case 'rec-subtype': recSetSubtype(el.getAttribute('data-sub')); break;
      case 'rec-save': recSave(); break;
      case 'del-record': {
        var kind = el.getAttribute('data-kind'), id = el.getAttribute('data-id');
        confirmModal('删除记录', '确定删除这条记录吗？此操作不可恢复。', '删除', function () { delRecord(kind, id); });
        break;
      }
      case 'save-mainline': saveMainline(); break;
      case 'change-mainline': changeMainline(); break;
      case 'ml-mark': mainlineCheckState[el.getAttribute('data-id')] = el.getAttribute('data-v'); render(); break;
      case 'finish-mainline-check': finishMainlineCheck(); break;
      case 'redo-mainline-check': mainlineCheckState = {}; render(); break;
      case 'review-range': reviewRange = el.getAttribute('data-r'); render(); break;
      case 'export-report': exportReport(); break;
      case 'export-backup': exportBackup(); break;
      case 'unlock-pro': unlockPro(); break;
      case 'import-backup': $id('importFile').click(); break;
      case 'cloud-backup-now': doBackup(); break;
      case 'cloud-restore': cloudRestore(); break;
      case 'reset-data': resetData(); break;
      case 'goto-today': location.hash = '#/today'; break;
      case 'goto-settings': location.hash = '#/settings'; break;
      case 'goto-mainline': location.hash = '#/mainline'; break;
      case 'goto-learn': location.hash = '#/learn'; break;
      case 'learn-path': learnFilter.level = parseInt(el.getAttribute('data-lv'), 10) || 1; render(); break;
      case 'learn-theme': learnFilter.theme = el.getAttribute('data-t'); render(); break;
      case 'learn-mentor': learnFilter.mentor = el.getAttribute('data-m'); render(); break;
      case 'learn-type': learnFilter.type = el.getAttribute('data-ty'); render(); break;
      case 'learn-note': openLearnNoteModal(el.getAttribute('data-kid')); break;
      case 'learn-note-save': learnNoteSave(); break;
      case 'learn-convert-asset': openConvertAssetModal(el.getAttribute('data-id')); break;
      case 'learn-convert-evidence': openConvertEvidenceModal(el.getAttribute('data-id')); break;
      case 'learn-del': {
        var lnid = el.getAttribute('data-id');
        confirmModal('删除学习笔记', '确定删除这条提升记录吗？此操作不可恢复。', '删除', function () { learnDel(lnid); });
        break;
      }
      case 'learn-drop': learnDrop(el.getAttribute('data-id')); break;
      case 'dismiss-backup': db.meta.backupDismissDate = todayStr; persist(); render(); break;
      case 'modal-close': closeModal(); break;
      case 'tab-nav': location.hash = '#/' + el.getAttribute('data-route'); break;
    }
  }

  function viewTodayOutput() {
    var s = sessionOf(todayStr);
    if (!s) return;
    var h = '';
    if (s.output) h += '<p style="font-size:14px;white-space:pre-wrap;word-break:break-word;">' + esc(s.output) + '</p>';
    else h += '<p class="muted">今日还没有产出内容。</p>';
    h += '<div class="btn-row"><button class="btn-ghost" data-action="modal-close">关闭</button></div>';
    openModal(h);
    modalTitle('今日产出');
  }

  function recSetKind(kind) {
    recordModalState.kind = kind;
    if (kind === 'asset' && !ASSET_TYPES.some(function (t) { return t.v === recordModalState.subtype; })) recordModalState.subtype = 'article';
    if (kind === 'evidence' && !EVIDENCE_TYPES.some(function (t) { return t.v === recordModalState.subtype; })) recordModalState.subtype = 'pain';
    var grid = $id('recSubtypes'), extra = $id('recExtra');
    if (grid) grid.innerHTML = subtypeButtons(kind, recordModalState.subtype);
    if (extra) extra.innerHTML = extraField(kind, recordModalState.subtype);
  }
  function recSetSubtype(sub) {
    recordModalState.subtype = sub;
    var grid = $id('recSubtypes'), extra = $id('recExtra');
    if (grid) {
      grid.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-sub') === sub); });
    }
    if (extra) extra.innerHTML = extraField(recordModalState.kind, sub);
  }

  function delRecord(kind, id) {
    if (kind === 'asset') db.assets = db.assets.filter(function (a) { return a.id !== id; });
    else db.evidences = db.evidences.filter(function (e) { return e.id !== id; });
    db.dailySessions.forEach(function (s) {
      if (kind === 'asset') s.assetIds = s.assetIds.filter(function (x) { return x !== id; });
      else s.evidenceIds = s.evidenceIds.filter(function (x) { return x !== id; });
    });
    persist(); toast('已删除'); render();
  }

  function saveMainline() {
    var name = $id('mlName').value.trim();
    var start = $id('mlStart').value || todayStr;
    if (!name) { toast('请填写母线名称'); return; }
    db.mainline = { id: uid(), name: name, startDate: start, switchedCount: 0, lastSwitchReason: null, updatedAt: nowISO() };
    persist();
    toast('母线已设定：' + name);
    render();
  }
  function changeMainline() {
    var mask = openModal('<p class="muted" style="font-size:14px;margin-bottom:10px;">更换母线会重新开始 90 天倒计时，并记录 1 次更换。想清楚再换。</p><div class="field"><label class="field-label" for="newMlName">新母线名称</label><input id="newMlName" placeholder="新方向一句话"></div><div class="field"><label class="field-label" for="newMlReason">更换原因（会记录下来）</label><input id="newMlReason" placeholder="为什么换"></div><div class="btn-row"><button class="btn" id="doChangeMl">确认更换</button><button class="btn-ghost" data-action="modal-close">取消</button></div>');
    modalTitle('更换母线');
    $id('doChangeMl').addEventListener('click', function () {
      var name = $id('newMlName').value.trim() || db.mainline.name;
      var reason = $id('newMlReason').value.trim();
      if (!reason) { toast('请填写更换原因'); return; }
      db.mainline.name = name;
      db.mainline.switchedCount = (db.mainline.switchedCount || 0) + 1;
      db.mainline.lastSwitchReason = reason;
      db.mainline.startDate = todayStr;
      db.mainline.updatedAt = nowISO();
      persist(); closeModal(); toast('已更换母线（第 ' + db.mainline.switchedCount + ' 次）'); render();
    });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var act = el.getAttribute('data-action');
    handleAction(act, el);
  });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { location.hash = '#/' + t.getAttribute('data-route'); });
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'assetSearch') {
      recFilter.q = e.target.value.trim();
      renderRecords();
      var inp = $id('assetSearch');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'stageSelect') { db.user.stage = e.target.value; persist(); toast('阶段已更新为' + STAGE_CN[db.user.stage]); render(); }
    if (e.target.id === 'nicknameInput') {
      var nv = e.target.value.trim();
      db.user.nickname = nv;
      persist();
      toast(nv ? '昵称已更新' : '昵称已清除（将显示「转型者」）');
      render();
    }
    if (e.target.id === 'emailInput') {
      var v = e.target.value.trim();
      db.user.email = v;
      if (v && db.user.privacy == null) db.user.privacy = { agreedAt: nowISO(), version: 1 }; // 填邮箱 = 同意（方案 5.2）
      persist();
      toast(v ? '邮箱已保存，随匿名备份上传云端，仅用于防丢失' : '邮箱已清除');
      render();
    }
    if (e.target.id === 'cloudBackupToggle') {
      db.meta.cloudBackupDisabled = !e.target.checked;
      save(db); // 开关状态不触发备份，避免循环
      if (e.target.checked) { scheduleBackup(); toast('自动云端备份已开启'); render(); }
      else toast('自动云端备份已关闭（本地数据仍正常）');
    }
    if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  });

  window.addEventListener('hashchange', render);
  render();
  mountOnboarding(); // v1.17.0：启动时判定首次引导（新用户完整 3 屏 / 老用户轻量补填）
})();
</script>
  <!-- 匿名埋点 SDK（page_view / skill_download / lead_submit / skill_pack_submit → /api/track；失败静默不影响页面） -->
  <script src="/lib/track.js" defer onerror="this.remove()"></script>
</body>
