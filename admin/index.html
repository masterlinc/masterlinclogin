    /* ---------- API 封装 ---------- */
    var mockDB = mkMock();
    function api(method, path, body) {
      var token = getToken();
      if (MOCK) {
        return new Promise(function (resolve, reject) {
          setTimeout(function () {
            try { resolve(mockRoute(method, path, body)); } catch (e) { reject(e); }
          }, 180);
        });
      }
      return fetch(path, {
        method: method,
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Bearer ' + (token || '') },
        body: body ? JSON.stringify(body) : undefined
      }).then(function (res) {
        if (res.status === 401) { clearToken(); showLogin(); throw new Error('unauthorized'); }
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data && data.message ? data.message : 'HTTP ' + res.status);
          return data;
        });
      });
    }

    /* Mock 路由：与后端约定响应结构保持一致 */
    function mockRoute(method, path, body) {
      var u = path.split('?')[0], q = {};
      var qs = path.split('?')[1] || '';
      qs.split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
      if (u === '/api/admin/login') {
        if (method === 'POST' && body && body.username === mockDB.login.username && body.password === mockDB.login.password) {
          return { ok: true, token: 'mock-token-' + Date.now(), expiresAt: Date.now() + 7 * 86400000, expiresIn: 7 * 24 * 60 * 60, role: 'admin', userId: 'admin-' + mockDB.login.username, username: mockDB.login.username };
        }
        var err = new Error('用户名或密码错误');
        err.status = 401; throw err;
      }
      if (u === '/api/admin/skills') {
        if (method === 'GET') {
          return { ok: true, skills: mockDB.skills.slice() };
        }
        if (method === 'POST') { // upsert（新增或更新）
          var s = body || {};
          var id = String(s.skillId || s.id || '').trim();
          if (!id) { var e1 = new Error('缺少 skillId'); e1.status = 400; throw e1; }
          var found = null;
          mockDB.skills.forEach(function (x) { if (x.id === id) found = x; });
          var norm = {
            id: id, name: s.name || '', value: s.value || '', cat: s.cat || '其他',
            tools: Array.isArray(s.tools) ? s.tools : String(s.tools || '').split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean),
            diff: s.diff || '', time: s.time || '', format: s.format || '',
            file: s.file || '', dlName: s.dlName || '', dlText: s.dlText || '',
            hook: (s.hook && s.hook.href) ? s.hook : { href: s.hookHref || '/products/selfcheck.html', text: s.hookText || '' },
            preview: s.preview || { title: '方法骨架', style: 'grid', labels: ['①', '②', '③', '④'] },
            status: /^(off|offline|下线|0|false)$/i.test(String(s.status)) ? 'off' : 'on',
            sort: parseInt(s.sort, 10) || 0
          };
          if (found) {
            // upsert 部分更新：只覆盖传入字段，其余保留（与后端 upsertSkill 语义一致）
            Object.keys(norm).forEach(function (k) {
              var v = norm[k];
              if (s[k] !== undefined && s[k] !== null && s[k] !== '') found[k] = v;
            });
            found.status = /^(off|offline|下线|0|false)$/i.test(String(s.status)) ? 'off' : (s.status !== undefined ? 'on' : found.status);
            found.sort = s.sort !== undefined && s.sort !== null && s.sort !== '' ? (parseInt(s.sort, 10) || 0) : found.sort;
            norm = found;
          }
          else { norm.download = 0; mockDB.skills.push(norm); }
          return { ok: true, action: found ? 'update' : 'create', skill: norm };
        }
      }
      // PATCH /api/admin/skills/:id — 部分更新（上下线/排序等）
      var patchM = u.match(/^\/api\/admin\/skills\/([^/]+)$/);
      if (patchM && method === 'PATCH') {
        var pid = decodeURIComponent(patchM[1]);
        var target = null;
        mockDB.skills.forEach(function (x) { if (x.id === pid) target = x; });
        if (!target) { var e2 = new Error('Skill 不存在'); e2.status = 404; throw e2; }
        Object.keys(body || {}).forEach(function (k) { if (body[k] !== undefined) target[k] = body[k]; });
        return { ok: true, skill: target };
      }
      if (u === '/api/admin/leads') {
        var list = mockDB.leads.slice();
        if (q.source) list = list.filter(function (l) { return l.source.indexOf(q.source) !== -1; });
        if (q.q) list = list.filter(function (l) { return (l.email + l.question).toLowerCase().indexOf(q.q.toLowerCase()) !== -1; });
        list.sort(function (a, b) { return b.time - a.time; });
        if (q.export === 'csv') return { csv: true, rows: list };
        var lpage = Math.max(1, parseInt(q.page, 10) || 1);
        var lsize = Math.min(100, parseInt(q.pageSize, 10) || 20);
        var ltotal = list.length;
        return { ok: true, total: ltotal, page: lpage, pageSize: lsize, items: list.slice((lpage - 1) * lsize, lpage * lsize) };
      }
      if (u === '/api/admin/feedback') {
        if (method === 'GET') {
          var fbs = mockDB.feedback.slice();
          if (q.type && q.type !== '全部') fbs = fbs.filter(function (f) { return f.type === q.type; });
          if (q.status && q.status !== '全部') fbs = fbs.filter(function (f) { return f.status === q.status; });
          if (q.q) fbs = fbs.filter(function (f) { return (f.content + f.email).toLowerCase().indexOf(q.q.toLowerCase()) !== -1; });
          fbs.sort(function (a, b) { return b.time - a.time; });
          if (q.export === 'csv') return { csv: true, rows: fbs };
          var fbpage = Math.max(1, parseInt(q.page, 10) || 1);
          var fbsize = Math.min(100, parseInt(q.pageSize, 10) || 20);
          var fbtotal = fbs.length;
          return { ok: true, total: fbtotal, page: fbpage, pageSize: fbsize, items: fbs.slice((fbpage - 1) * fbsize, fbpage * fbsize) };
        }
      }
      var fbPatchM = u.match(/^\/api\/admin\/feedback\/([^/]+)$/);
      if (fbPatchM && method === 'PATCH') {
        var fid = decodeURIComponent(fbPatchM[1]);
        var ft = null;
        mockDB.feedback.forEach(function (x) { if (x.recordId === fid) ft = x; });
        if (!ft) { var e3 = new Error('反馈不存在'); e3.status = 404; throw e3; }
        if (body && body.status !== undefined) ft.status = body.status;
        if (body && body.note !== undefined) ft.note = body.note;
        return { ok: true, recordId: fid, status: ft.status, note: ft.note };
      }
      if (u === '/api/admin/events') {
        var evs = mockDB.events.slice();
        if (q.ev && q.ev !== '全部') evs = evs.filter(function (e) { return e.ev === q.ev; });
        evs.sort(function (a, b) { return b.time - a.time; });
        var epage = Math.max(1, parseInt(q.page, 10) || 1);
        var esize = Math.min(100, parseInt(q.pageSize, 10) || 50);
        var etotal = evs.length;
        return { ok: true, total: etotal, page: epage, pageSize: esize, items: evs.slice((epage - 1) * esize, epage * esize) };
      }
      if (u === '/api/admin/traffic') {
        var days = parseInt(q.days, 10) || 7;
        var t = mockDB.traffic;
        var dd = (t.daily || []).slice(-days);
        var agg = dd.reduce(function (a, b) { a.pv += b.pv || 0; a.uv += b.uv || 0; return a; }, { pv: 0, uv: 0 });
        return { ok: true, days: days, pv: agg.pv, uv: agg.uv, daily: dd, pages: t.pages || [], sources: t.sources || [], generatedAt: Date.now() };
      }
      if (u === '/api/admin/downloads') {
        var ds = mockDB.skills.map(function (s) {
          return { skillId: s.id, skillName: s.name, category: s.cat, count: s.download || 0, lastAt: Date.now() - 36e5 * ((s.sort || 1) * 3) };
        });
        var dtotal = ds.reduce(function (a, b) { return a + b.count; }, 0);
        return { ok: true, days: parseInt(q.days, 10) || 7, total: dtotal, skills: ds, generatedAt: Date.now() };
      }
      throw new Error('Mock 无此端点: ' + path);
    }

    /* ---------- Token 管理（7 天） ---------- */
    function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
    function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
    function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
    function isLoggedIn() { return !!getToken(); }

    /* ---------- 视图切换 ---------- */
    var loginView = $('loginView'), appView = $('appView');
    function showLogin() { loginView.hidden = false; appView.hidden = true; $('sidebar').classList.remove('open'); }

    function logout() { clearToken(); showLogin(); location.hash = ''; }

    };

    function currentRoute() {
      var h = location.hash || '';
      return ROUTES[h] ? h : '#/dashboard';
    }

    function router() {
      if (!isLoggedIn()) { showLogin(); return; }
      var route = currentRoute();
      showApp();
      document.querySelectorAll('.nav-item').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-route') === route);
      });
      $('pageTitle').textContent = ROUTES[route].title;
      var content = $('content');
      content.innerHTML = '<div class="muted" style="padding:40px;text-align:center;">加载中…</div>';

        ROUTES[route].render(content);
      } catch (e) {

          $('loginUsername').value = '';
          location.hash = '#/dashboard';
          router();
        } else { throw new Error('登录响应异常'); }

        var msg = err && err.status === 401 ? '用户名或密码错误，请重试。' : (err && err.message ? err.message : '登录失败，请检查网络。');
        $('loginError').textContent = msg;
      }).finally(function () {
        btn.disabled = false; btn.textContent = '进入驾驶舱 →';
      });
    });

    $('logoutBtn').addEventListener('click', logout);

    /* ---------- 仪表盘 ---------- */

        api('GET', '/api/admin/leads'),
        api('GET', '/api/admin/skills'),
        api('GET', '/api/admin/feedback')
      ]).then(function (res) {
        var traffic = res[0], dl = res[1], leads = res[2], skills = res[3], fb = res[4];
        var daily = (traffic.daily || []);

        var leadsList = leads.items || leads.data || [];

    function statCard(label, num, hint) {
      return '<div class="stat-card"><div class="label">' + label + '</div><div class="num">' + esc(num) + '</div><div class="hint">' + hint + '</div></div>';
    }

    function topDownloadsHtml(list) {
      if (!list.length) return '<div class="empty">暂无下载数据</div>';
      var max = Math.max.apply(null, list.map(function (x) { return x.unique != null ? x.unique : x.count; }));
      var html = '';
      list.forEach(function (s, i) {
        var v = s.unique != null ? s.unique : s.count;
        var w = max ? Math.round(v / max * 100) : 0;
        html += '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>' + (i + 1) + '. ' + esc(s.skillName || s.name || s.skillId) + '</span><span class="muted">' + v + '</span></div><div class="bar"><i style="width:' + w + '%;"></i></div></div>';
      });
      return html;
    }

    /* =====================================================
     * 通用图表 + Skill 管理 + 访问数据
     * ===================================================== */
    function trendChart(days, withLegend) {
      if (!days || !days.length) return '<div class="empty">暂无数据</div>';
      var max = 1;
      days.forEach(function (d) { max = Math.max(max, d.pv || 0, d.uv || 0); });
      var html = withLegend ? '<div class="trend-legend"><span><i class="pv-dot"></i>PV</span><span><i class="uv-dot"></i>UV</span></div>' : '';
      html += '<div class="trend-chart">';
      days.forEach(function (d) {
        var ph = Math.round((d.pv || 0) / max * 100);
        var uh = Math.round((d.uv || 0) / max * 100);
        var label = String(d.date || '').slice(5);
        html += '<div class="trend-col"><div class="l">' + label + '</div><div style="display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;flex:1;">';
        html += '<div class="c pv" style="height:' + Math.max(4, ph) + '%;"><i></i></div>';
        html += '<div class="c uv" style="height:' + Math.max(4, uh) + '%;"><i></i></div>';
        html += '</div></div>';
      });
      html += '</div>';
      return html;
    }

    function barRow(label, val, max, sub) {
      var w = max ? Math.round(val / max * 100) : 0;
      return '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>' + esc(label) + (sub ? ' <span class="muted small">' + esc(sub) + '</span>' : '') + '</span><span class="muted">' + val + '</span></div><div class="bar"><i style="width:' + w + '%;"></i></div></div>';
    }

        if (ss) ss.addEventListener('change', function () { feedbackState.status = this.value; feedbackState.page = 1; });
        var inp = $('fbSearch');
        if (inp) inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') window.__adminApplyFeedbackFilter(); });
      }).catch(function (err) {
        if (err && err.message === 'unauthorized') return;
        el.innerHTML = '<div class="card"><div class="err-text">加载失败：' + esc(err.message) + '</div></div>';
      });
    }
    function fbOpsHtml(rid, status, note) {
      var html = '';
      FB_STATUSES.forEach(function (s) {
        if (s === status) return;
        html += '<button class="btn ghost sm" onclick="window.__adminSetFeedbackStatus(' + qstr(rid) + ', ' + qstr(s) + ')">' + s + '</button> ';
      });
      html += '<button class="btn ghost sm" onclick="window.__adminEditFeedbackNote(' + qstr(rid) + ', ' + qstr(note || '') + ')">备注</button>';
      return html;
    }
    window.__adminSetFeedbackStatus = function (rid, status) {
      api('PATCH', '/api/admin/feedback/' + encodeURIComponent(rid), { status: status }).then(function () {
        toast('已标记：' + status, 'ok');
        router();
      }).catch(function (err) { toast(err.message || '操作失败', 'err'); });
    };
    window.__adminApplyFeedbackFilter = function () {
      feedbackState.type = $('fbTypeFilter') ? $('fbTypeFilter').value : feedbackState.type;
      feedbackState.status = $('fbStatusFilter') ? $('fbStatusFilter').value : feedbackState.status;
      feedbackState.q = $('fbSearch') ? $('fbSearch').value.trim() : feedbackState.q;
      feedbackState.page = 1;
      router();
    };
    window.__adminFeedbackPage = function (p) { feedbackState.page = p; router(); };
    window.__adminEditFeedbackNote = function (rid, note) {
      openModal('<h3>反馈备注</h3>' +
        '<div class="field"><label>内部备注（仅你可见）</label><textarea id="fb-note" rows="3">' + esc(note) + '</textarea></div>' +
        '<div class="modal-actions"><button class="btn ghost" onclick="window.__adminCloseModal()">取消</button><button class="btn" onclick="window.__adminSaveFeedbackNote(' + qstr(rid) + ')">保存</button></div>');
    };
    window.__adminSaveFeedbackNote = function (rid) {
      var note = $('fb-note') ? $('fb-note').value.trim() : '';
      api('PATCH', '/api/admin/feedback/' + encodeURIComponent(rid), { note: note }).then(function () {
        closeModal(); toast('备注已保存', 'ok'); router();
      }).catch(function (err) { toast(err.message || '保存失败', 'err'); });
    };
    window.__adminExportFeedback = function () {
      var q = '/api/admin/feedback?export=csv'
        + '&type=' + encodeURIComponent(feedbackState.type === '全部' ? '' : feedbackState.type)
        + '&status=' + encodeURIComponent(feedbackState.status === '全部' ? '' : feedbackState.status)
        + '&q=' + encodeURIComponent(feedbackState.q);
      if (MOCK) {
        try {
          var rows = mockDB.feedback;
          var csv = '\ufeff时间,类型,内容,邮箱,版本,页面,设备ID,状态,备注\n';
          rows.forEach(function (f) {
            csv += [new Date(f.time).toLocaleString('zh-CN'), f.type, (f.content || ''), f.email, (f.version || ''), (f.page || ''), (f.deviceId || ''), f.status, (f.note || '')].map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',') + '\n';
          });
          downloadCSV(csv, 'feedback-' + todayStr() + '.csv');
        } catch (e) { toast('导出失败', 'err'); }
        return;
      }
      var token = getToken();
      fetch(q, { headers: { 'Authorization': 'Bearer ' + token } }).then(function (res) {
        if (res.status === 401) { clearToken(); showLogin(); throw new Error('unauthorized'); }
        return res.text();
      }).then(function (text) { downloadCSV(text, 'feedback-' + todayStr() + '.csv'); }).catch(function (e) { if (e.message !== 'unauthorized') toast('导出失败', 'err'); });
    };

    function downloadCSV(text, name) {
      var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 200);
    }

    /* ---------- 下载统计 ---------- */
    function renderDownloads(el) {
      api('GET', '/api/admin/downloads').then(function (data) {
        var skills = data.skills || [];
        var total = data.total || 0;
        var packLeads = 0;
        try { packLeads = mockDB.leads.filter(function (l) { return String(l.source || '').indexOf('skill-pack') === 0; }).length; } catch (e) {}
        var html = '';
        html += '<div class="grid grid-4" style="margin-bottom:18px;">';
        html += statCard('去重下载总数', total, 'uid+skillId');
        html += statCard('Skill 数', skills.length, '在线+离线');
        html += statCard('全集包线索', MOCK ? packLeads : '-', 'skill-pack 来源');
        html += statCard('统计范围', data.days ? '近 ' + data.days + ' 天' : '-', '默认 7 天');
        html += '</div>';
        if (!skills.length) { html += '<div class="card"><div class="empty">暂无下载数据</div></div>'; }
        else {
          var max = Math.max.apply(null, skills.map(function (s) { return s.count || 0; }));
          html += '<div class="card"><h3>按 Skill 聚合（去重口径：同设备同 Skill 只计 1）</h3>';
          html += '<div class="table-wrap"><table><thead><tr><th>Skill</th><th>分类</th><th class="num">去重数</th><th class="num">占比</th><th>趋势（去重数条形）</th></tr></thead><tbody>';
          skills.slice().sort(function (a, b) { return (b.count || 0) - (a.count || 0); }).forEach(function (s) {
            var v = s.count || 0;
            var w = max ? Math.round(v / max * 100) : 0;
            html += '<tr>';
            html += '<td>' + esc(s.skillName || s.name || s.skillId) + '<div class="small muted">' + esc(s.skillId || '') + '</div></td>';
            html += '<td>' + esc(s.category || s.cat || '-') + '</td>';
            html += '<td class="num">' + v + '</td>';
            html += '<td class="num small muted">' + (total ? Math.round(v / total * 100) + '%' : '-') + '</td>';
            html += '<td><div class="bar" style="min-width:120px;"><i style="width:' + w + '%;"></i></div></td>';
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          html += '</div>';
        }
        html += '<div class="card small muted">口径：按匿名 uid + skillId 首次聚合去重；点击重复下载不累加。与前台 localStorage 去重口径一致。</div>';
        el.innerHTML = html;
      }).catch(function (err) {
        if (err && err.message === 'unauthorized') return;
        el.innerHTML = '<div class="card"><div class="err-text">加载失败：' + esc(err.message) + '</div></div>';
      });
    }

    function pager(total, pages, cur, fn) {
      if (!total) return '';
      return '<div class="pager"><span>共 ' + total + ' 条 · 第 ' + cur + '/' + pages + ' 页</span>' +
        '<button class="btn ghost sm" onclick="' + fn + '(' + (cur - 1) + ')" ' + (cur <= 1 ? 'disabled' : '') + '>上一页</button>' +
        '<button class="btn ghost sm" onclick="' + fn + '(' + (cur + 1) + ')" ' + (cur >= pages ? 'disabled' : '') + '>下一页</button></div>';
    }

    /* =====================================================
     * 初始化
     * ===================================================== */
    $('todayLabel').textContent = '今天：' + todayStr();
    if (!isLoggedIn()) showLogin(); else router();
    window.addEventListener('hashchange', router);



  })();

  </script>
</body>
</html>
